name: EchoReplay
version: 1.1.4
main: dev.idebugger.echoreplay.EchoReplay
api-version: '1.21'
folia-supported: false
description: Server-Side Region Replay for Paper 1.21+
author: EchoReplay
website: https://github.com/IntellsGamer/EchoReplay

commands:
  echoreplay:
    description: EchoReplay main command
    usage: /echoreplay <subcommand>
    aliases: [er, replay]
  er:
    description: EchoReplay alias
    usage: /er <subcommand>
  replay:
    description: EchoReplay alias
    usage: /replay <subcommand>

permissions:
  echoreplay.use:
    description: Basic usage
    default: true
  echoreplay.wand:
    description: Use the selection wand
    default: op
  echoreplay.select:
    description: Use selection commands
    default: op
  echoreplay.record:
    description: Record replays
    default: op
  echoreplay.play:
    description: Play replays
    default: op
  echoreplay.play.*:
    description: Play any recording (wildcard for per-recording echoreplay.play.<name>)
    default: op
  echoreplay.control:
    description: Control playback (pause, seek, speed, controls)
    default: op
  echoreplay.watch:
    description: Auto-watch replays
    default: true
  echoreplay.border:
    description: Toggle playback border particles
    default: true
  echoreplay.fps:
    description: Trim replay particles/sounds for yourself
    default: true
  echoreplay.privacy:
    description: Opt out of recordings
    default: true
  echoreplay.delete:
    description: Delete recordings
    default: op
  echoreplay.admin:
    description: Admin commands (reload config)
    default: op
  echoreplay.bypass-limits:
    description: Bypass selection limits
    default: op
